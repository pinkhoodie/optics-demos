<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Optics Study</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #020305; }
    canvas { display: block; width: 100%; height: 100%; }
    #caption {
      position: fixed;
      left: clamp(22px, 4vw, 64px);
      bottom: clamp(20px, 4vw, 54px);
      z-index: 2;
      color: rgba(255,255,255,.86);
      font: 500 10px/1.6 Arial, Helvetica, sans-serif;
      letter-spacing: .28em;
      text-transform: uppercase;
      pointer-events: none;
      text-shadow: 0 0 18px rgba(255,255,255,.16);
    }
    #caption strong { display: block; font-size: 12px; letter-spacing: .38em; color: #fff; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="caption"></div>
  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    window.__ready = false;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.prepend(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020305);
    scene.fog = new THREE.FogExp2(0x020305, 0.028);

    const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0.15, 10.8);
    camera.lookAt(0, 0, 0);

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.25, 0.65, 0.22);
    composer.addPass(bloom);
    composer.addPass(new OutputPass());

    const caption = document.querySelector('#caption');
    const requested = new URLSearchParams(location.search).get('scene');
    const mode = requested === 'mirror' ? 'mirror' : 'prism';

    const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x07090d, roughness: 0.7, metalness: 0.2 });
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 18), floorMaterial);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -1.55;
    floor.receiveShadow = true;
    scene.add(floor);

    scene.add(new THREE.HemisphereLight(0x64758e, 0x020204, 0.18));

    function beamBetween(a, b, color, radius = 0.025, intensity = 4, opacity = 1, z = 0.5) {
      const start = new THREE.Vector3(a.x, a.y, a.z ?? z);
      const end = new THREE.Vector3(b.x, b.y, b.z ?? z);
      const delta = end.clone().sub(start);
      const material = new THREE.MeshBasicMaterial({
        color,
        transparent: opacity < 1,
        opacity,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        toneMapped: false
      });
      material.color.multiplyScalar(intensity);
      const beam = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, delta.length(), 12, 1, true), material);
      beam.position.copy(start).add(end).multiplyScalar(0.5);
      beam.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), delta.normalize());
      scene.add(beam);

      const hazeMaterial = new THREE.MeshBasicMaterial({
        color,
        transparent: true,
        opacity: 0.095 * opacity,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        toneMapped: false
      });
      const haze = new THREE.Mesh(new THREE.CylinderGeometry(radius * 4.5, radius * 4.5, start.distanceTo(end), 12, 1, true), hazeMaterial);
      haze.position.copy(beam.position);
      haze.quaternion.copy(beam.quaternion);
      scene.add(haze);
      return beam;
    }

    function glowDisc(position, color, size, opacity = 0.4, z = 0.7) {
      const material = new THREE.MeshBasicMaterial({
        color,
        transparent: true,
        opacity,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        toneMapped: false
      });
      const disc = new THREE.Mesh(new THREE.CircleGeometry(size, 48), material);
      disc.position.set(position.x, position.y, position.z ?? z);
      scene.add(disc);
      return disc;
    }

    function createPrismGeometry() {
      const xy = [[-2.05, -1.28], [2.05, -1.28], [0, 1.78]];
      const z0 = -0.72, z1 = 0.72;
      const p = xy.flatMap(([x, y]) => [x, y, z0]).concat(xy.flatMap(([x, y]) => [x, y, z1]));
      const indices = [
        0, 2, 1, 3, 4, 5,
        0, 1, 4, 0, 4, 3,
        1, 2, 5, 1, 5, 4,
        2, 0, 3, 2, 3, 5
      ];
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      return geometry;
    }

    function buildPrism() {
      caption.innerHTML = '<strong>Prism</strong>macro refraction and dispersion';
      camera.position.set(-0.15, 0.1, 10.6);

      const prism = new THREE.Mesh(createPrismGeometry(), new THREE.MeshPhysicalMaterial({
        color: 0xe8f6ff,
        metalness: 0,
        roughness: 0.045,
        transmission: 1,
        thickness: 1.45,
        ior: 1.52,
        attenuationColor: new THREE.Color(0xbfe6ff),
        attenuationDistance: 5,
        transparent: true,
        opacity: 1,
        specularIntensity: 1,
        specularColor: new THREE.Color(0xffffff),
        side: THREE.DoubleSide
      }));
      prism.castShadow = true;
      prism.renderOrder = 2;
      scene.add(prism);

      const edges = new THREE.LineSegments(
        new THREE.EdgesGeometry(prism.geometry, 20),
        new THREE.LineBasicMaterial({ color: 0xbde8ff, transparent: true, opacity: 0.42, blending: THREE.AdditiveBlending })
      );
      edges.renderOrder = 3;
      prism.add(edges);

      const key = new THREE.SpotLight(0xd8eeff, 75, 22, Math.PI / 7, 0.8, 1.8);
      key.position.set(-4.5, 5.5, 7);
      key.target.position.set(0, 0, 0);
      key.castShadow = true;
      scene.add(key, key.target);

      const rim = new THREE.PointLight(0x99ccff, 22, 12, 2);
      rim.position.set(2.8, 2.6, 3.5);
      scene.add(rim);

      const entry = new THREE.Vector3(-1.18, 0.02, 0.78);
      const exit = new THREE.Vector3(1.05, 0.22, 0.78);
      beamBetween(new THREE.Vector3(-7.5, 0.72, 0.78), entry, 0xffffff, 0.035, 5.6, 1, 0.78);
      beamBetween(entry, exit, 0xeefaff, 0.032, 2.3, 0.72, 0.78);

      glowDisc(entry, 0xffffff, 0.15, 0.95, 0.81);
      glowDisc(entry, 0xbbeeff, 0.34, 0.22, 0.80);
      const spark = new THREE.PointLight(0xdff8ff, 36, 3.5, 2);
      spark.position.copy(entry);
      scene.add(spark);

      const spectrum = [
        [0xff1f14, -0.045],
        [0xff6a12, -0.105],
        [0xffd522, -0.17],
        [0x38ff79, -0.245],
        [0x28a9ff, -0.335],
        [0x514cff, -0.43],
        [0x9e45ff, -0.535]
      ];
      for (const [color, slope] of spectrum) {
        const farX = 8.3;
        const end = new THREE.Vector3(farX, exit.y + (farX - exit.x) * slope, 0.78);
        beamBetween(exit, end, color, 0.03, 4.8, 0.95, 0.78);
      }

      const halo = new THREE.Mesh(
        new THREE.CircleGeometry(0.95, 64),
        new THREE.MeshBasicMaterial({ color: 0x6aa8ff, transparent: true, opacity: 0.075, blending: THREE.AdditiveBlending, depthWrite: false })
      );
      halo.scale.set(1.8, 0.32, 1);
      halo.position.set(0.45, -1.47, 0.18);
      scene.add(halo);
    }

    function buildMirror() {
      caption.innerHTML = '<strong>Mirror</strong>macro specular reflection';
      camera.position.set(0.1, 0.15, 10.7);

      const angle = 0.30;
      const frameMaterial = new THREE.MeshStandardMaterial({ color: 0x05070a, roughness: 0.2, metalness: 0.82 });
      const chromeMaterial = new THREE.MeshPhysicalMaterial({
        color: 0xdde5ed,
        roughness: 0.055,
        metalness: 1,
        clearcoat: 1,
        clearcoatRoughness: 0.025
      });

      const frame = new THREE.Mesh(new THREE.BoxGeometry(5.7, 0.6, 1.35, 12, 2, 2), frameMaterial);
      frame.rotation.z = angle;
      frame.position.set(0, -0.2, 0);
      frame.castShadow = true;
      scene.add(frame);

      const normal = new THREE.Vector3(-Math.sin(angle), Math.cos(angle), 0).normalize();
      const tangent = new THREE.Vector3(Math.cos(angle), Math.sin(angle), 0).normalize();
      const chrome = new THREE.Mesh(new THREE.BoxGeometry(5.22, 0.22, 1.42, 18, 2, 2), chromeMaterial);
      chrome.rotation.z = angle;
      chrome.position.copy(frame.position).addScaledVector(normal, 0.36);
      chrome.castShadow = true;
      scene.add(chrome);

      const hit = chrome.position.clone().addScaledVector(normal, 0.12);
      hit.addScaledVector(tangent, -0.25);
      hit.z = 0.78;
      const source = new THREE.Vector3(-6.8, 3.25, 0.78);
      const incident = hit.clone().sub(source).normalize();
      const reflected = incident.clone().sub(normal.clone().multiplyScalar(2 * incident.dot(normal))).normalize();
      const reflectedEnd = hit.clone().addScaledVector(reflected, 8.8);

      beamBetween(source, hit, 0xffffff, 0.038, 5.8, 1, 0.78);
      beamBetween(hit, reflectedEnd, 0xf4fbff, 0.038, 5.8, 1, 0.78);

      glowDisc(hit, 0xffffff, 0.17, 1, 0.82);
      glowDisc(hit, 0xd7edff, 0.42, 0.25, 0.81);
      const hot = new THREE.PointLight(0xe8f6ff, 55, 4.5, 2);
      hot.position.copy(hit);
      scene.add(hot);

      const streakMaterial = new THREE.MeshBasicMaterial({
        color: 0xcce8ff,
        transparent: true,
        opacity: 0.58,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        toneMapped: false
      });
      streakMaterial.color.multiplyScalar(3.2);
      const streak = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 0.045), streakMaterial);
      streak.rotation.z = angle;
      streak.position.copy(hit).addScaledVector(normal, 0.015);
      streak.position.z = 0.82;
      scene.add(streak);

      const longGlow = new THREE.Mesh(
        new THREE.PlaneGeometry(4.3, 0.22),
        new THREE.MeshBasicMaterial({ color: 0x7dbaff, transparent: true, opacity: 0.08, blending: THREE.AdditiveBlending, depthWrite: false })
      );
      longGlow.rotation.z = angle;
      longGlow.position.copy(streak.position);
      longGlow.position.z = 0.80;
      scene.add(longGlow);

      const key = new THREE.SpotLight(0xffffff, 105, 24, Math.PI / 9, 0.72, 1.6);
      key.position.set(-4.8, 5.8, 7.5);
      key.target.position.copy(hit);
      scene.add(key, key.target);
      const rim = new THREE.RectAreaLight(0x82bfff, 18, 5, 2);
      rim.position.set(3.5, 3.3, 4);
      rim.lookAt(chrome.position);
      scene.add(rim);
    }

    if (mode === 'mirror') buildMirror(); else buildPrism();

    let frames = 0;
    function render() {
      composer.render();
      frames += 1;
      if (frames >= 6) window.__ready = true;
      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
