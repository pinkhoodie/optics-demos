<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>prism vs mirror</title>
<style>
  html,body{margin:0;height:100%;background:#04060a;overflow:hidden}
  canvas{display:block}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 30%, rgba(0,0,0,.82) 100%)}
  .label{position:fixed;left:42px;bottom:38px;color:rgba(235,242,255,.62);
    font:500 15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",Helvetica,Arial,sans-serif;
    letter-spacing:.22em;text-transform:uppercase;pointer-events:none;text-shadow:0 2px 18px #000}
  .label b{display:block;color:rgba(255,255,255,.92);font-weight:600;font-size:19px;letter-spacing:.16em;margin-bottom:4px}
  .label span{letter-spacing:.06em;text-transform:none;font-weight:400;font-size:13px;color:rgba(200,215,235,.5)}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const sceneName = new URLSearchParams(location.search).get('scene') || 'prism';
const W = innerWidth, H = innerHeight;

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

function beam(a, b, r, color, haloScale = 2.6, haloOpacity = 0.10, seg = 14) {
  const start = new THREE.Vector3(...a), end = new THREE.Vector3(...b);
  const dir = new THREE.Vector3().subVectors(end, start);
  const len = dir.length(); const n = dir.clone().normalize();
  const g = new THREE.Group();
  const core = new THREE.Mesh(
    new THREE.CylinderGeometry(r, r, len, seg, 1, false),
    new THREE.MeshBasicMaterial({ color, toneMapped: false })
  );
  const halo = new THREE.Mesh(
    new THREE.CylinderGeometry(r * haloScale, r * haloScale, len, seg, 1, false),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: haloOpacity,
      blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false })
  );
  for (const m of [core, halo]) { m.position.copy(start).add(dir.clone().multiplyScalar(0.5)); m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), n); g.add(m); }
  return g;
}

function lights() {
  const key = new THREE.DirectionalLight(0xffffff, 2.4); key.position.set(-3.5, 4.5, 3.5);
  const rim = new THREE.DirectionalLight(0x7fc6ff, 3.2); rim.position.set(3.5, 1.5, -4.5);
  const fill = new THREE.PointLight(0x5aa6ff, 8, 12); fill.position.set(2.5, -2, 3);
  scene.add(key, rim, fill);
}

/* ---------------- PRISM ---------------- */
function buildPrism() {
  lights();
  const shape = new THREE.Shape();
  shape.moveTo(-1.05, -0.86); shape.lineTo(1.05, -0.86); shape.lineTo(0, 0.92); shape.closePath();
  const geo = new THREE.ExtrudeGeometry(shape, { depth: 0.92, bevelEnabled: true, bevelSize: 0.012, bevelThickness: 0.012, bevelSegments: 2 });
  geo.center();
  const glass = new THREE.MeshPhysicalMaterial({
    color: 0xffffff, metalness: 0, roughness: 0.045, transmission: 1, thickness: 1.4,
    ior: 1.52, clearcoat: 1, clearcoatRoughness: 0.03, envMapIntensity: 1.9,
    transparent: true, opacity: 1, specularIntensity: 1
  });
  const prism = new THREE.Mesh(geo, glass);
  prism.position.set(0, -0.05, 0);
  scene.add(prism);

  const edges = new THREE.LineSegments(
    new THREE.EdgesGeometry(geo, 12),
    new THREE.LineBasicMaterial({ color: 0xbfe4ff, transparent: true, opacity: 0.35 })
  );
  edges.position.copy(prism.position); scene.add(edges);

  // incoming white beam
  const entry = new THREE.Vector3(-0.72, -0.22, 0.16);
  const src = new THREE.Vector3(-6.2, 0.06, 0.16);
  scene.add(beam(src.toArray(), entry.toArray(), 0.035, 0xffffff, 3.0, 0.11));
  scene.add(beam([-1.9, 0.02, 0.16], entry.toArray(), 0.075, 0xdfeaff, 3.4, 0.05)); // near-camera bloom sheath

  // inside prism
  const exit = new THREE.Vector3(0.66, -0.24, 0.16);
  scene.add(beam(entry.toArray(), exit.toArray(), 0.026, 0xffffff, 2.2, 0.07));

  // dispersion fan
  const colors = ['#ff2547', '#ff7a18', '#ffd93d', '#4bff8f', '#31d6ff', '#4364ff', '#b34bff'];
  const a0 = -0.10, a1 = -0.58;
  colors.forEach((c, i) => {
    const t = i / (colors.length - 1);
    const ang = a0 + (a1 - a0) * t;
    const L = 6.4;
    const end = new THREE.Vector3(exit.x + Math.cos(ang) * L, exit.y + Math.sin(ang) * L, 0.16 - t * 0.05);
    scene.add(beam(exit.toArray(), end.toArray(), 0.022, c, 2.9, 0.10));
  });

  // impact sparkle
  const spark = new THREE.Mesh(new THREE.SphereGeometry(0.05, 16, 16),
    new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false }));
  spark.position.copy(entry); scene.add(spark);

  const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40),
    new THREE.MeshStandardMaterial({ color: 0x0a0d13, metalness: 0.55, roughness: 0.42, envMapIntensity: 0.5 }));
  floor.rotation.x = -Math.PI / 2; floor.position.y = -0.94; scene.add(floor);

  const cam = new THREE.PerspectiveCamera(34, W / H, 0.1, 100);
  cam.position.set(1.05, 0.55, 5.65);
  cam.lookAt(-0.02, -0.20, 0);

  const lbl = document.createElement('div');
  lbl.className = 'label';
  lbl.innerHTML = '<b>Prism</b><span>macro &middot; refraction &amp; dispersion</span>';
  document.body.appendChild(lbl);
  return cam;
}

/* ---------------- MIRROR ---------------- */
function buildMirror() {
  lights();
  const center = new THREE.Vector3(0, 0, 0);
  const di = new THREE.Vector3(1, -0.42, -0.30).normalize();   // incoming direction
  const dov = new THREE.Vector3(0.45, -0.86, 0.26).normalize(); // outgoing direction
  const n = new THREE.Vector3().subVectors(dov, di).normalize(); // surface normal

  // mirror slab + frame
  const slabGeo = new THREE.BoxGeometry(3.5, 2.55, 0.13);
  const slab = new THREE.Mesh(slabGeo, new THREE.MeshPhysicalMaterial({
    color: 0xe8f0f8, metalness: 1, roughness: 0.028, envMapIntensity: 2.0,
    clearcoat: 1, clearcoatRoughness: 0.02
  }));
  const frame = new THREE.Mesh(new THREE.BoxGeometry(3.72, 2.78, 0.09),
    new THREE.MeshStandardMaterial({ color: 0x11161d, metalness: 0.9, roughness: 0.38 }));
  const grp = new THREE.Group();
  frame.position.z = -0.09;
  grp.add(frame, slab);
  grp.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), n);
  grp.position.copy(center);
  scene.add(grp);

  // beams
  const pIn = center.clone().addScaledVector(di, -6.4);
  const pOut = center.clone().addScaledVector(dov, 6.4);
  scene.add(beam(pIn.toArray(), center.toArray(), 0.032, 0xffffff, 3.0, 0.11));
  scene.add(beam(center.toArray(), pOut.toArray(), 0.030, 0xffffff, 3.0, 0.11));
  // thin reflected-tint on the surface for readability
  scene.add(beam(center.clone().addScaledVector(di, -2.6).toArray(), center.toArray(), 0.062, 0xd7e8ff, 3.2, 0.045));

  const hot = new THREE.Mesh(new THREE.SphereGeometry(0.062, 20, 20),
    new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false }));
  hot.position.copy(center).addScaledVector(n, 0.08); scene.add(hot);

  const cam = new THREE.PerspectiveCamera(36, W / H, 0.1, 100);
  cam.position.copy(center.clone().addScaledVector(n, 3.15).add(new THREE.Vector3(0.85, 0.55, 0)));
  cam.lookAt(center);

  const lbl = document.createElement('div');
  lbl.className = 'label';
  lbl.innerHTML = '<b>Mirror</b><span>macro &middot; specular reflection</span>';
  document.body.appendChild(lbl);
  return cam;
}

const camera = sceneName === 'mirror' ? buildMirror() : buildPrism();

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 0.82, 0.72, 0.34);
composer.addPass(bloom);

let frames = 0;
function loop() {
  composer.render();
  frames++;
  if (frames === 6) window.__ready = true;
  requestAnimationFrame(loop);
}
loop();
window.__scene = sceneName;
</script>
</body>
</html>
